<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今日勉励语句</title>
<style>
  /* ---------- 默认配色：青蓝 ---------- */
  body {
    --bg: linear-gradient(160deg, #023047 0%, #00648e 45%, #0090b8 75%, #00b4d8 100%);
    --text: #e9fbff;
    --sub: #caf0f8;
    --accent: #90e0ef;
    --btn: linear-gradient(135deg, #caf0f8, #90e0ef 50%, #48cae4);
    --btn-text: #022b3a;
  }

  /* 海洋蓝 */
  body[data-theme="ocean"] {
    --bg: linear-gradient(160deg, #0b1d3a 0%, #123a6b 45%, #1e5fa8 75%, #3b82c4 100%);
    --text: #eaf4ff;
    --sub: #c3dcff;
    --accent: #8ab8ff;
    --btn: linear-gradient(135deg, #c3dcff, #8ab8ff 50%, #5a96e8);
    --btn-text: #0b1d3a;
  }

  /* 薄荷绿 */
  body[data-theme="mint"] {
    --bg: linear-gradient(160deg, #052e22 0%, #0b5d43 45%, #12876a 75%, #2fb89a 100%);
    --text: #eafff5;
    --sub: #c7f5e3;
    --accent: #7fe0c0;
    --btn: linear-gradient(135deg, #c7f5e3, #7fe0c0 50%, #3fc79f);
    --btn-text: #052e22;
  }

  /* 星空紫 */
  body[data-theme="violet"] {
    --bg: linear-gradient(160deg, #2a1a4a 0%, #4a2d7a 45%, #6d4bb0 75%, #8e6fd8 100%);
    --text: #f5efff;
    --sub: #d9ccff;
    --accent: #b39dff;
    --btn: linear-gradient(135deg, #d9ccff, #b39dff 50%, #8e6fd8);
    --btn-text: #2a1a4a;
  }

  /* 落日橙 */
  body[data-theme="sunset"] {
    --bg: linear-gradient(160deg, #4a1d12 0%, #8a3d1f 45%, #c25e2a 75%, #f0843c 100%);
    --text: #fff5ea;
    --sub: #ffd9b8;
    --accent: #ffb877;
    --btn: linear-gradient(135deg, #ffd9b8, #ffb877 50%, #ff9a4d);
    --btn-text: #4a1d12;
  }

  /* 樱花粉 */
  body[data-theme="sakura"] {
    --bg: linear-gradient(160deg, #4a1a2e 0%, #8a2f52 45%, #c24d7a 75%, #f07da8 100%);
    --text: #ffeef4;
    --sub: #ffc9dd;
    --accent: #ff9dc0;
    --btn: linear-gradient(135deg, #ffc9dd, #ff9dc0 50%, #f77ca8);
    --btn-text: #4a1a2e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
    transition: background 0.5s ease;
  }

  /* 漂浮气泡装饰 */
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.04));
    border: 1px solid rgba(255, 255, 255, 0.25);
    animation: float 12s ease-in-out infinite;
    pointer-events: none;
  }
  .bubble:nth-child(1) { width: 220px; height: 220px; top: -60px; left: -40px; }
  .bubble:nth-child(2) { width: 160px; height: 160px; bottom: -40px; right: 8%; animation-delay: -3s; }
  .bubble:nth-child(3) { width: 110px; height: 110px; top: 18%; right: -30px; animation-delay: -6s; }
  .bubble:nth-child(4) { width: 90px; height: 90px; bottom: 22%; left: 6%; animation-delay: -9s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-28px) translateX(18px); }
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    text-align: center;
    color: var(--text);
  }

  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.6s ease both; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .app-icon {
    width: 76px;
    height: 76px;
    margin: 0 auto 26px;
    border-radius: 22px;
    background: var(--btn);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
  }

  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
  }

  .subtitle {
    font-size: 16px;
    color: var(--sub);
    opacity: 0.9;
    margin-bottom: 46px;
    letter-spacing: 1px;
  }

  .btn {
    display: inline-block;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--btn-text);
    background: var(--btn);
    padding: 18px 46px;
    border-radius: 999px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45); filter: brightness(1.05); }
  .btn:active { transform: translateY(0); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); }

  .quote-card {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.32);
    border-radius: 24px;
    padding: 44px 32px;
    backdrop-filter: blur(8px);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.3);
  }

  .quote-mark {
    font-size: 44px;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 14px;
  }

  .quote-text {
    font-size: 22px;
    line-height: 1.8;
    color: var(--text);
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.2);
  }

  .actions {
    margin-top: 34px;
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn.ghost {
    background: rgba(255, 255, 255, 0.12);
    color: var(--text);
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: none;
    padding: 14px 34px;
    font-size: 16px;
  }
  .btn.ghost:hover { background: rgba(255, 255, 255, 0.2); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25); }
  .btn.ghost:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

  .secondary-actions {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  /* 配色切换 */
  .theme-picker {
    margin-top: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .theme-label {
    font-size: 14px;
    color: var(--sub);
    letter-spacing: 2px;
    margin-right: 2px;
  }
  .swatch {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.6);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .swatch:hover { transform: scale(1.18); }
  .swatch.active { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9); }

  .swatch[data-theme="cyan"]   { background: linear-gradient(135deg, #00b4d8, #023047); }
  .swatch[data-theme="ocean"]  { background: linear-gradient(135deg, #3b82c4, #0b1d3a); }
  .swatch[data-theme="mint"]   { background: linear-gradient(135deg, #2fb89a, #052e22); }
  .swatch[data-theme="violet"] { background: linear-gradient(135deg, #8e6fd8, #2a1a4a); }
  .swatch[data-theme="sunset"] { background: linear-gradient(135deg, #f0843c, #4a1d12); }
  .swatch[data-theme="sakura"] { background: linear-gradient(135deg, #f07da8, #4a1a2e); }

  /* ---------- 小镜子 ---------- */
  .mirror-title { font-size: 22px; font-weight: 700; letter-spacing: 3px; margin-bottom: 18px; }
  .mirror-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 20px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.35);
    border: 2px solid rgba(255, 255, 255, 0.35);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
  }
  .mirror-frame img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .mirror-placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--sub); font-size: 15px; letter-spacing: 1px;
  }
  .mirror-effects { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .fx {
    border: 1px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.12);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .fx:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.2); }
  .fx.active { background: var(--btn); color: var(--btn-text); border-color: transparent; font-weight: 600; }
  .mirror-sliders { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; padding: 0 10px; }
  .mirror-sliders label { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--sub); letter-spacing: 1px; }
  .mirror-sliders input[type=range] { flex: 1; accent-color: var(--accent); }
  .mirror-actions { margin-top: 18px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .mirror-actions .btn { padding: 12px 28px; font-size: 16px; }
  .mirror-status { margin-top: 12px; font-size: 13px; color: var(--sub); min-height: 18px; letter-spacing: 1px; word-break: break-all; }
  #btn-mirror-back { margin-top: 18px; }

  /* ---------- 打飞机小游戏 ---------- */
  .game-frame {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
  }
  .game-frame canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
    border-radius: 16px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.4);
    cursor: default;
  }
  .game-over {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 16px;
  }
  .game-over.show { display: flex; }
  .game-over-card { text-align: center; padding: 28px 24px; }
  .game-over-title { font-size: 26px; font-weight: 700; letter-spacing: 3px; color: #fff; margin-bottom: 14px; }
  .game-over-score { font-size: 18px; color: #fff; margin-bottom: 22px; letter-spacing: 1px; }
  .game-over-score span { color: var(--accent); font-weight: 700; }
  .game-over-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .game-hint { margin-top: 12px; font-size: 13px; color: var(--sub); letter-spacing: 1px; }
  #btn-game-exit { margin-top: 14px; }

  /* ---------- 连点提示 toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    top: 9%;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(255, 255, 255, 0.95);
    color: #1a3a4a;
    padding: 12px 24px;
    border-radius: 999px;
    font-size: 15px;
    letter-spacing: 1px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 100;
    max-width: 90%;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body data-theme="cyan">
  <div class="bubble"></div>

  <div class="stage">

  </div>

      "愿你被爱，也被需要，",
      "愿你眼角的笑意，比春光更明媚，",
      "愿你慢慢变好，也慢慢被这世界善待，",
      "愿你的每一步，都走得踏实而从容，",
      "愿你在无人问津的日子里，也要好好照顾自己，",
      "愿你的努力，配得上你的野心，",
      "愿你既能朝九晚五，也能心向山海，",
      "愿你心中常怀热爱，奔赴下一场山海，",
      "愿你所有的等待，都不被辜负，",
      "愿你在薄情的世界里，深情地活着，",
      "愿你的未来，如约而至，",
      "愿你眼中有星辰大海，心中有繁花似锦，",
      "愿你余生不慌，有梦可追，",
      "愿你即使走得慢，也从不后退，",
      "愿你把所有的将就，都换成讲究，"
    ];

    const quoteEndings = [
      "而我，始终在你看得见的地方。",
      "而我，一直为你留着最柔软的一盏灯。",
      "这份温柔，会永远陪在你身旁。",
      "我把所有的祝福，都悄悄说给了风听。",
      "你在的地方，便是我心之所向的远方。",
      "无论相隔多远，我的心始终朝向你。",
      "愿爱与温柔，与你长久相伴。",
      "而我，永远是你疲惫时可以停靠的岸。",
      "这一程山水，我会一直陪着你走。",
      "你是我眼里，永不熄灭的那束光。",
      "请记得，这世间总有人温柔地牵挂着你。",
      "我的心意，如星子般，始终为你亮着。",
      "愿我的挂念，能化作你前行的微光。",
      "我爱你，像爱这世间所有的美好。",
      "我把偏爱与温柔，都悄悄留给了你。",
      "愿你被深爱，也温柔地爱着自己。"
    ];

    const quotes = [];
    for (let a = 0; a < quoteOpenings.length; a++) {
      for (let b = 0; b < quoteBodies.length; b++) {
        for (let c = 0; c < quoteEndings.length; c++) {
          quotes.push(quoteOpenings[a] + quoteBodies[b] + quoteEndings[c]);
        }
      }
    }
    // 打乱顺序，保证每次打开呈现的顺序不同
    for (let i = quotes.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = quotes[i]; quotes[i] = quotes[j]; quotes[j] = t;
    }

    const startScreen = document.getElementById("screen-start");
    const quoteScreen = document.getElementById("screen-quote");
    const quoteText = document.getElementById("quote-text");
    const btnStart = document.getElementById("btn-start");
    const btnAgain = document.getElementById("btn-again");
    const btnBack = document.getElementById("btn-back");
    const btnMore = document.getElementById("btn-more");
    const mirrorScreen = document.getElementById("screen-mirror");
    const btnMirror = document.getElementById("btn-mirror");
    const btnMirrorBack = document.getElementById("btn-mirror-back");
    const mirrorImg = document.getElementById("mirror");
    const mirrorPlaceholder = document.getElementById("mirror-placeholder");
    const fxButtons = document.querySelectorAll(".fx");
    const smoothSlider = document.getElementById("smooth");
    const brightnessSlider = document.getElementById("brightness");
    const btnCapture = document.getElementById("btn-capture");
    const btnOpenPhotos = document.getElementById("btn-open-photos");
    const mirrorStatus = document.getElementById("mirror-status");
    const themePicker = document.querySelector(".theme-picker");
    // pywebview 的 js_api 是异步注入的（启动后约 1 秒才可用），需动态读取，不能存进变量
    function getApi() {
      return window.pywebview && window.pywebview.api;
    }

    let lastIndex = -1;

    function showQuote() {
      let idx;
      do {
        idx = Math.floor(Math.random() * quotes.length);
      } while (idx === lastIndex && quotes.length > 1);
      lastIndex = idx;
      quoteText.textContent = quotes[idx];
    }

    function goTo(screen) {
      startScreen.classList.toggle("active", screen === "start");
      quoteScreen.classList.toggle("active", screen === "quote");
      mirrorScreen.classList.toggle("active", screen === "mirror");
      gameScreen.classList.toggle("active", screen === "game");
      themePicker.style.display = (screen === "mirror" || screen === "game") ? "none" : "flex";
    }

    btnStart.addEventListener("click", function () {
      showQuote();
      goTo("quote");
    });

    // ---------- 防连点：快速点击“再获取一句”会弹出随机幽默提示 ----------
    const toastEl = document.getElementById("toast");
    const funnyTips = [
      "别急嘛，好句子也要喘口气呀～",
      "手指点太快，句子们还没准备好呢！",
      "慢一点，让句子们排个队再出来～",
      "你已经迫不及待了吗？句子还在后台梳妆呢～",
      "轻点轻点，按钮要被你点哭啦！",
      "你的手速，把句子们都吓到躲起来了～",
      "叮！检测到你的急切，已加急处理，但还是要排队哦～",
      "别刷啦，会腻的，慢慢品嘛～",
      "再快也要优雅，句子正不紧不慢地赶来～",
      "句子表示：我压力山大，容我缓缓～",
      "点到即止，温柔一点嘛～",
      "这一句还没消化，下一句就来啦？贪心哦～",
      "稍安勿躁，好饭不怕晚，好句不怕慢～",
      "你的热情我收到了，但句子也想被认真对待呀～",
      "哦豁，你开启了连点暴击模式～",
      "手速惊人，但句子也需要一点仪式感呀～",
      "停一停，让好句子在你心里多住一会儿～",
      "我猜你是在测试按钮的耐久度，它已经瑟瑟发抖了～",
      "慢慢来，惊喜才不会错过你呀～"
    ];
    let lastAgainClick = 0;
    let toastTimer = null;
    let cooldownTimer = null;

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toastEl.classList.remove("show");
      }, 1800);
    }

    function triggerCooldown() {
      showToast(funnyTips[Math.floor(Math.random() * funnyTips.length)]);
      btnAgain.disabled = true;
      if (cooldownTimer) clearTimeout(cooldownTimer);
      cooldownTimer = setTimeout(function () {
        btnAgain.disabled = false;
      }, 1500);
    }

    btnAgain.addEventListener("click", function () {
      if (btnAgain.disabled) return;
      const now = Date.now();
      showQuote();
      if (lastAgainClick && now - lastAgainClick < 600) {
        triggerCooldown();
      }
      lastAgainClick = now;
    });

    btnBack.addEventListener("click", function () {
      goTo("start");
    });

    btnMore.addEventListener("click", function () {
      const url = "https://www.yuanshen.com/";
      // 在打包的桌面应用里通过 pywebview 调用系统默认浏览器打开
      if (window.pywebview && window.pywebview.api && window.pywebview.api.open_url) {
        window.pywebview.api.open_url(url);
      } else {
        window.open(url, "_blank");
      }
    });

    // ---------- 小镜子 ----------
    btnMirror.addEventListener("click", async function () {
      // 等待 js_api 注入完成（异步，启动后约 1 秒）
      for (let i = 0; i < 40 && !getApi(); i++) {
        await new Promise(function (r) { setTimeout(r, 100); });
      }
      const api = getApi();
      if (!api) {
        mirrorPlaceholder.textContent = "桌面接口未就绪，请稍后重试";
        goTo("mirror");
        return;
      }
      mirrorPlaceholder.textContent = "正在开启相机…";
      mirrorPlaceholder.style.display = "flex";
      mirrorImg.style.display = "none";
      mirrorStatus.textContent = "";
      const url = await api.start_mirror();
      if (url) {
        mirrorImg.src = url;
        mirrorImg.style.display = "block";
        mirrorPlaceholder.style.display = "none";
      } else {
        mirrorPlaceholder.textContent = "无法打开摄像头，请检查系统相机权限";
      }
      goTo("mirror");
    });

    btnMirrorBack.addEventListener("click", function () {
      if (getApi()) getApi().stop_mirror();
      mirrorImg.src = "";
      mirrorImg.style.display = "none";
      mirrorPlaceholder.textContent = "正在开启相机…";
      goTo("start");
    });

    fxButtons.forEach(function (b) {
      b.addEventListener("click", function () {
        fxButtons.forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
        if (getApi()) getApi().set_effect(b.getAttribute("data-effect"));
      });
    });

    smoothSlider.addEventListener("input", function () {
      if (getApi()) getApi().set_param("smooth", this.value);
    });
    brightnessSlider.addEventListener("input", function () {
      if (getApi()) getApi().set_param("brightness", this.value);
    });

    btnCapture.addEventListener("click", async function () {
      const api = getApi();
      if (!api) return;
      const path = await api.capture();
      if (path) {
        mirrorStatus.textContent = "已保存：" + path;
      } else {
        mirrorStatus.textContent = "拍照失败，相机可能尚未就绪";
      }
    });

    btnOpenPhotos.addEventListener("click", function () {
      if (getApi()) getApi().open_photos();
    });

    // ---------- 打飞机小游戏 ----------
    const gameScreen = document.getElementById("screen-game");
    const btnGame = document.getElementById("btn-game");
    const gameCanvas = document.getElementById("game-canvas");
    const gctx = gameCanvas.getContext("2d");
    const gameOverOverlay = document.getElementById("game-over");
    const finalScoreEl = document.getElementById("final-score");
    const btnRetry = document.getElementById("btn-retry");
    const btnGameBack = document.getElementById("btn-game-back");
    const btnGameExit = document.getElementById("btn-game-exit");

    const GW = 420, GH = 560;
    gameCanvas.width = GW;
    gameCanvas.height = GH;

    const game = {
      running: false, raf: null, lastTs: 0, time: 0, score: 0,
      player: null, bullets: [], meteors: [], stars: [],
      spawnAcc: 0, fireAcc: 0, keys: {}
    };

    function gameReset() {
      game.time = 0; game.score = 0;
      game.bullets = []; game.meteors = [];
      game.spawnAcc = 0; game.fireAcc = 0;
      game.player = { x: GW / 2, y: GH - 50 };
      game.keys = {};
      game.stars = [];
      for (let i = 0; i < 60; i++) {
        game.stars.push({ x: Math.random() * GW, y: Math.random() * GH, r: Math.random() * 1.5 + 0.5 });
      }
    }

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    function spawnMeteor() {
      const r = 12 + Math.random() * 12;
      game.meteors.push({
        x: r + Math.random() * (GW - 2 * r),
        y: -r,
        r: r,
        vy: (60 + Math.random() * 50) * Math.min(2.5, 1 + game.time * 0.02),
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 2
      });
    }

    function spawnBullet() {
      game.bullets.push({ x: game.player.x, y: game.player.y - 20, vy: -420 });
    }

    function updateGame(dt) {
      // 生成陨石：随时间加快（数量变多）
      const spawnInterval = Math.max(0.42, 0.95 - game.time * 0.008);
      game.spawnAcc += dt;
      while (game.spawnAcc >= spawnInterval) {
        game.spawnAcc -= spawnInterval;
        spawnMeteor();
      }

      // 自动发射子弹
      game.fireAcc += dt;
      while (game.fireAcc >= 0.18) {
        game.fireAcc -= 0.18;
        spawnBullet();
      }

      // 玩家移动
      const p = game.player;
      const speed = 300;
      if (game.keys["ArrowLeft"] || game.keys["a"]) p.x -= speed * dt;
      if (game.keys["ArrowRight"] || game.keys["d"]) p.x += speed * dt;
      if (game.keys["ArrowUp"] || game.keys["w"]) p.y -= speed * dt;
      if (game.keys["ArrowDown"] || game.keys["s"]) p.y += speed * dt;
      p.x = clamp(p.x, 18, GW - 18);
      p.y = clamp(p.y, GH * 0.4, GH - 24);

      // 子弹移动
      for (let i = game.bullets.length - 1; i >= 0; i--) {
        game.bullets[i].y += game.bullets[i].vy * dt;
        if (game.bullets[i].y < -10) game.bullets.splice(i, 1);
      }

      // 陨石移动
      for (let i = game.meteors.length - 1; i >= 0; i--) {
        const m = game.meteors[i];
        m.y += m.vy * dt;
        m.rot += m.vr * dt;
        if (m.y - m.r > GH + 10) game.meteors.splice(i, 1);
      }

      // 子弹命中陨石
      for (let i = game.meteors.length - 1; i >= 0; i--) {
        const m = game.meteors[i];
        for (let j = game.bullets.length - 1; j >= 0; j--) {
          const b = game.bullets[j];
          const dx = b.x - m.x, dy = b.y - m.y;
          if (dx * dx + dy * dy < m.r * m.r) {
            game.bullets.splice(j, 1);
            game.meteors.splice(i, 1);
            game.score += (m.r < 16) ? 2 : 1;
            break;
          }
        }
      }

      // 飞机碰到陨石 -> 游戏结束
      const pr = 14;
      for (const m of game.meteors) {
        const dx = p.x - m.x, dy = p.y - m.y;
        if (dx * dx + dy * dy < (m.r + pr) * (m.r + pr)) {
          gameOver();
          return;
        }
      }
    }

    function drawPlane(x, y) {
      gctx.save();
      gctx.translate(x, y);
      gctx.fillStyle = "#8ed8ff";
      gctx.beginPath();
      gctx.moveTo(0, -20);
      gctx.lineTo(-8, 14);
      gctx.lineTo(8, 14);
      gctx.closePath();
      gctx.fill();
      gctx.fillStyle = "#ffd166";
      gctx.beginPath();
      gctx.moveTo(0, -4);
      gctx.lineTo(-22, 12);
      gctx.lineTo(-8, 8);
      gctx.closePath();
      gctx.fill();
      gctx.beginPath();
      gctx.moveTo(0, -4);
      gctx.lineTo(22, 12);
      gctx.lineTo(8, 8);
      gctx.closePath();
      gctx.fill();
      gctx.fillStyle = "#ff8c42";
      gctx.beginPath();
      gctx.moveTo(-3, 14);
      gctx.lineTo(0, 24);
      gctx.lineTo(3, 14);
      gctx.closePath();
      gctx.fill();
      gctx.restore();
    }

    function drawMeteor(m) {
      gctx.save();
      gctx.translate(m.x, m.y);
      gctx.rotate(m.rot);
      gctx.fillStyle = "#9b8a76";
      gctx.beginPath();
      gctx.arc(0, 0, m.r, 0, Math.PI * 2);
      gctx.fill();
      gctx.fillStyle = "rgba(255,255,255,0.18)";
      gctx.beginPath();
      gctx.arc(-m.r * 0.3, -m.r * 0.3, m.r * 0.45, 0, Math.PI * 2);
      gctx.fill();
      gctx.strokeStyle = "#5b4a3a";
      gctx.lineWidth = 2;
      gctx.beginPath();
      gctx.arc(0, 0, m.r, 0, Math.PI * 2);
      gctx.stroke();
      gctx.restore();
    }

    function drawGame() {
      const g = gctx.createLinearGradient(0, 0, 0, GH);
      g.addColorStop(0, "#050810");
      g.addColorStop(1, "#0d1b2a");
      gctx.fillStyle = g;
      gctx.fillRect(0, 0, GW, GH);

      gctx.fillStyle = "#fff";
      for (const s of game.stars) {
        gctx.globalAlpha = 0.4 + s.r * 0.3;
        gctx.beginPath();
        gctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        gctx.fill();
      }
      gctx.globalAlpha = 1;

      for (const m of game.meteors) drawMeteor(m);

      gctx.fillStyle = "#ffe066";
      for (const b of game.bullets) {
        gctx.fillRect(b.x - 2, b.y - 7, 4, 14);
      }

      drawPlane(game.player.x, game.player.y);

      gctx.fillStyle = "#fff";
      gctx.font = "bold 20px 'Segoe UI', sans-serif";
      gctx.textAlign = "right";
      gctx.fillText("得分 " + game.score, GW - 16, 34);
      gctx.textAlign = "left";
    }

    function gameOver() {
      if (!game.running) return;
      game.running = false;
      cancelAnimationFrame(game.raf);
      finalScoreEl.textContent = game.score;
      gameOverOverlay.classList.add("show");
    }

    function startGame() {
      gameReset();
      game.running = true;
      gameOverOverlay.classList.remove("show");
      game.lastTs = performance.now();
      game.raf = requestAnimationFrame(loop);
    }

    function stopGame() {
      game.running = false;
      if (game.raf) cancelAnimationFrame(game.raf);
      gameOverOverlay.classList.remove("show");
    }

    function loop(ts) {
      if (!game.running) return;
      const dt = Math.min(0.05, (ts - game.lastTs) / 1000);
      game.lastTs = ts;
      game.time += dt;
      updateGame(dt);
      drawGame();
      game.raf = requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", function (e) {
      game.keys[e.key] = true;
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].indexOf(e.key) >= 0) {
        e.preventDefault();
      }
    });
    window.addEventListener("keyup", function (e) {
      game.keys[e.key] = false;
    });

    btnGame.addEventListener("click", function () {
      goTo("game");
      startGame();
    });
    btnRetry.addEventListener("click", startGame);
    btnGameBack.addEventListener("click", function () {
      stopGame();
      goTo("start");
    });
    btnGameExit.addEventListener("click", function () {
      stopGame();
      goTo("start");
    });

    // ---------- 配色切换 ----------
    const swatches = document.querySelectorAll(".swatch");

    function applyTheme(theme) {
      document.body.setAttribute("data-theme", theme);
      swatches.forEach(function (s) {
        s.classList.toggle("active", s.getAttribute("data-theme") === theme);
      });
    }

    swatches.forEach(function (s) {
      s.addEventListener("click", function () {
        const theme = s.getAttribute("data-theme");
        applyTheme(theme);
        localStorage.setItem("quote-theme", theme);
      });
    });

    // 恢复上次配色（默认青蓝）
    applyTheme(localStorage.getItem("quote-theme") || "cyan");
  </script>
</body>
</html>
